<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clinical Research Assistant</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #0f1115; color: #e6e6e6; height: 100vh; }
  #root { display: flex; height: 100vh; }

  /* ── Sidebar ─────────────────────────────────────────────── */
  .sidebar { width: 280px; background: #171a21; border-right: 1px solid #262a33; display: flex; flex-direction: column; }
  .sidebar-top { padding: 16px; }
  .sidebar-top h2 { font-size: 13px; font-weight: 700; text-transform: uppercase; color: #8b93a7; margin: 0 0 12px; letter-spacing: .5px; }
  .new-thread-btn { width: 100%; padding: 10px 14px; background: #4a7fd9; color: #fff; border: 0; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .new-thread-btn:hover { background: #5a8fe9; }
  .thread-list { flex: 1; overflow-y: auto; padding: 0 12px; }
  .thread-item { padding: 10px 12px; margin-bottom: 4px; background: transparent; border-radius: 6px; cursor: pointer; font-size: 13px; line-height: 1.4; display: flex; flex-direction: column; gap: 2px; }
  .thread-item:hover { background: #1f232c; }
  .thread-item.active { background: #1f232c; border-left: 3px solid #4a7fd9; }
  .thread-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thread-meta { font-size: 11px; color: #5a6070; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .workflow-pill { font-size: 9px; text-transform: uppercase; letter-spacing: .4px; padding: 1px 6px; border-radius: 3px; font-weight: 600; }
  .workflow-pill.meta_analysis { background: #142a30; color: #7adfdf; }
  .workflow-pill.search_strategy { background: #1c2532; color: #a3b3df; }
  .workflow-pill.sr_protocol { background: #1d2a1f; color: #a3dfa3; }
  .workflow-pill.risk_of_bias { background: #2a1d1d; color: #dfa3a3; }
  .workflow-pill.general_qa { background: #1f232c; color: #b3b9c8; }
  .thread-actions { opacity: 0; margin-left: auto; }
  .thread-item:hover .thread-actions { opacity: 1; }
  .thread-delete { background: none; border: 0; color: #d97a7a; cursor: pointer; font-size: 12px; padding: 2px 6px; border-radius: 4px; }
  .thread-delete:hover { background: #2a1010; }
  .sidebar-bottom { padding: 12px 16px; border-top: 1px solid #262a33; }
  .sidebar-link { display: flex; align-items: center; gap: 8px; padding: 8px 10px; color: #8b93a7; text-decoration: none; font-size: 13px; border-radius: 6px; cursor: pointer; border: 0; background: 0; width: 100%; text-align: left; }
  .sidebar-link:hover { background: #1f232c; color: #e6e6e6; }
  .sidebar-divider { height: 1px; background: #262a33; margin: 8px 0; }
  .empty-threads { padding: 20px 12px; text-align: center; color: #5a6070; font-size: 13px; }

  /* ── Notifications bell + dropdown ─────────────────────────── */
  .bell-row { position: relative; }
  .bell-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 16px; height: 16px; padding: 0 5px; background: #d97a7a; color: #fff; border-radius: 9px; font-size: 10px; font-weight: 700; margin-left: auto; }
  .bell-badge.zero { background: transparent; color: #5a6070; font-weight: 400; }
  .notif-dropdown { position: absolute; bottom: 100%; left: 8px; right: 8px; margin-bottom: 4px; background: #1f232c; border: 1px solid #2a2f3a; border-radius: 6px; max-height: 360px; overflow-y: auto; z-index: 50; box-shadow: 0 -8px 24px rgba(0,0,0,0.4); }
  .notif-item { padding: 10px 12px; border-bottom: 1px solid #262a33; cursor: pointer; font-size: 12px; line-height: 1.4; }
  .notif-item:last-child { border-bottom: 0; }
  .notif-item:hover { background: #262a33; }
  .notif-item.unread { border-left: 3px solid #4a7fd9; padding-left: 9px; }
  .notif-item.read   { opacity: 0.6; }
  .notif-title { color: #e6e6e6; font-weight: 600; margin-bottom: 2px; }
  .notif-summary { color: #b3b9c8; font-size: 11px; line-height: 1.5; }
  .notif-meta { color: #5a6070; font-size: 10px; margin-top: 4px; display: flex; gap: 8px; }
  .notif-empty { padding: 16px 12px; text-align: center; color: #5a6070; font-size: 12px; }

  /* ── Main ─────────────────────────────────────────────────── */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .header { padding: 12px 20px; border-bottom: 1px solid #262a33; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
  .header h1 { margin: 0; font-size: 16px; }
  .health { font-size: 12px; color: #8b93a7; }

  /* ── Conversation area ──────────────────────────────────── */
  .conversation { flex: 1; overflow-y: auto; padding: 24px 32px; max-width: 920px; width: 100%; margin: 0 auto; }
  .turn { margin-bottom: 16px; }
  .turn-user { background: #1a2332; color: #b3cfee; padding: 12px 16px; border-radius: 8px; font-size: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .turn-user .role-tag { font-size: 11px; text-transform: uppercase; font-weight: 600; color: #5a83b3; margin-bottom: 4px; letter-spacing: .5px; }

  .card { background: #171a21; border: 1px solid #262a33; border-radius: 8px; padding: 18px 22px; }
  .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .card-tag { font-size: 11px; text-transform: uppercase; font-weight: 700; letter-spacing: .8px; padding: 3px 8px; border-radius: 4px; }
  .card-tag.clarification { background: #2a2010; color: #d9a84a; }
  .card-tag.pico { background: #102a15; color: #6bcf7f; }
  .card-tag.search_results { background: #1a2332; color: #7aa7d9; }
  .card-tag.answer { background: #1f232c; color: #b3b9c8; }
  .card h3 { margin: 0; font-size: 16px; color: #e6e6e6; font-weight: 600; }
  .card .rationale { color: #8b93a7; font-size: 13px; margin-top: 12px; line-height: 1.5; padding-top: 12px; border-top: 1px solid #1f232c; }

  /* ── PICO editor ────────────────────────────────────────── */
  .pico-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
  .pico-grid .full { grid-column: 1 / -1; }
  .pico-field { display: flex; flex-direction: column; gap: 4px; }
  .pico-field label { font-size: 11px; text-transform: uppercase; color: #5a6070; font-weight: 600; letter-spacing: .5px; }
  .pico-field textarea, .pico-field input { background: #0f1115; color: #e6e6e6; border: 1px solid #2a2f3a; border-radius: 4px; padding: 8px 10px; font: inherit; font-size: 13px; resize: vertical; }
  .pico-field textarea { min-height: 60px; }
  .pico-field .hint { font-size: 11px; color: #5a6070; margin-top: 2px; }

  .list-editor { display: flex; flex-direction: column; gap: 4px; }
  .list-row { display: flex; gap: 6px; }
  .list-row input { flex: 1; }
  .list-row button { padding: 4px 10px; background: #2a2f3a; color: #8b93a7; border: 0; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .list-row button:hover { background: #3a3f4a; color: #e6e6e6; }
  .add-btn { align-self: flex-start; background: transparent; color: #4a7fd9; border: 1px dashed #4a7fd9; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .add-btn:hover { background: #1a2332; }

  .card-actions { display: flex; gap: 10px; margin-top: 16px; padding-top: 14px; border-top: 1px solid #1f232c; }
  .btn-primary { background: #4a7fd9; color: #fff; border: 0; border-radius: 6px; padding: 9px 18px; font-weight: 600; font-size: 13px; cursor: pointer; }
  .btn-primary:hover { background: #5a8fe9; }
  .btn-primary:disabled { background: #333; color: #777; cursor: not-allowed; }
  .btn-secondary { background: transparent; color: #8b93a7; border: 1px solid #2a2f3a; border-radius: 6px; padding: 9px 18px; font-weight: 600; font-size: 13px; cursor: pointer; }
  .btn-secondary:hover { background: #1f232c; color: #e6e6e6; }

  /* ── Clarification ──────────────────────────────────────── */
  .clarification-q { font-size: 15px; line-height: 1.5; margin: 0 0 12px; }
  .options { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .option-btn { background: #1f232c; color: #d9a84a; border: 1px solid #2a2010; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .option-btn:hover { background: #2a2010; color: #f0c87a; }

  /* ── Search results ─────────────────────────────────────── */
  .strategy-block { background: #0f1115; border: 1px solid #2a2f3a; border-radius: 6px; padding: 12px 14px; margin-bottom: 16px; font-size: 12px; }
  .strategy-block .label { font-size: 10px; text-transform: uppercase; color: #5a6070; font-weight: 600; letter-spacing: .5px; margin-bottom: 4px; }
  .strategy-query { font-family: 'Consolas', 'Monaco', monospace; color: #b3cfee; word-break: break-all; line-height: 1.5; }
  .filter-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .chip { background: #1a2332; color: #7aa7d9; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
  .mesh-chip { background: #1f232c; color: #8b93a7; padding: 2px 8px; border-radius: 10px; font-size: 11px; }

  .study-card { border: 1px solid #2a2f3a; border-radius: 6px; padding: 14px 16px; margin-bottom: 10px; background: #0f1115; display: flex; gap: 10px; }
  .study-card.selected { border-color: #4a7fd9; background: #14182a; }
  .study-checkbox { margin-top: 2px; width: 16px; height: 16px; accent-color: #4a7fd9; cursor: pointer; flex-shrink: 0; }
  .study-body { flex: 1; min-width: 0; }
  .study-title { font-size: 14px; font-weight: 600; color: #e6e6e6; line-height: 1.4; margin-bottom: 4px; }
  .study-title a { color: inherit; text-decoration: none; }
  .study-title a:hover { color: #7aa7d9; }
  .study-meta { font-size: 12px; color: #8b93a7; margin-bottom: 8px; }
  .study-link { color: #7aa7d9; text-decoration: none; }
  .study-link:hover { color: #b3cfee; text-decoration: underline; }
  .study-relevance { font-size: 12px; color: #6bcf7f; background: #102a15; border-left: 3px solid #6bcf7f; padding: 6px 10px; border-radius: 3px; margin-bottom: 8px; }
  .study-abstract { font-size: 12px; color: #b3b9c8; line-height: 1.5; margin: 8px 0; }
  .study-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  .toggle-abstract { background: none; border: 0; color: #5a83b3; cursor: pointer; font-size: 11px; padding: 2px 0; text-decoration: underline; }

  /* ── Selection bar ──────────────────────────────────────── */
  .selection-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: #0f1115; border: 1px solid #2a2f3a; border-radius: 6px; margin-bottom: 14px; font-size: 13px; }
  .selection-count { color: #b3b9c8; }
  .selection-count.warn { color: #d9a84a; }
  .selection-count.error { color: #d97a7a; }

  /* ── Data extraction ────────────────────────────────────── */
  .extraction-summary { background: #102a15; color: #b3e6c1; padding: 10px 14px; border-radius: 6px; font-size: 13px; line-height: 1.5; margin-bottom: 14px; border-left: 3px solid #6bcf7f; }
  .extraction-helper { background: #1a2332; color: #b3cfee; padding: 10px 14px; border-radius: 6px; font-size: 12px; line-height: 1.5; margin-bottom: 14px; border-left: 3px solid #4a7fd9; }
  .extraction-helper strong { color: #d9a84a; }
  .extract-study { border: 1px solid #2a2f3a; border-radius: 6px; padding: 12px 14px; margin-bottom: 12px; background: #0f1115; }
  .extract-study-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #1f232c; }
  .extract-study-title { font-size: 13px; font-weight: 600; color: #e6e6e6; line-height: 1.4; flex: 1; }
  .extract-study-title a { color: inherit; text-decoration: none; }
  .extract-study-title a:hover { color: #7aa7d9; }
  .extract-meta { font-size: 11px; color: #5a6070; margin-top: 2px; }
  .outcome-row { padding: 10px 0; border-bottom: 1px dashed #1f232c; }
  .outcome-row:last-child { border-bottom: 0; }
  .outcome-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .outcome-name { flex: 1; font-size: 13px; font-weight: 600; color: #b3b9c8; }
  .effect-select { background: #1f232c; color: #e6e6e6; border: 1px solid #2a2f3a; border-radius: 4px; padding: 4px 8px; font: inherit; font-size: 12px; }
  .source-badge { font-size: 10px; text-transform: uppercase; padding: 2px 7px; border-radius: 3px; letter-spacing: .5px; font-weight: 600; }
  .source-badge.abstract { background: #1a2332; color: #7aa7d9; }
  .source-badge.full_text { background: #102a15; color: #6bcf7f; }
  .source-badge.user_provided { background: #2a2010; color: #d9a84a; }
  .complete-flag { font-size: 11px; padding: 2px 7px; border-radius: 3px; letter-spacing: .3px; }
  .complete-flag.ok { background: #102a15; color: #6bcf7f; }
  .complete-flag.warn { background: #2a1010; color: #d97a7a; }
  .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
  .data-field { display: flex; flex-direction: column; gap: 2px; }
  .data-field label { font-size: 10px; text-transform: uppercase; color: #5a6070; font-weight: 600; letter-spacing: .3px; }
  .data-field input { background: #1f232c; color: #e6e6e6; border: 1px solid #2a2f3a; border-radius: 4px; padding: 5px 8px; font: inherit; font-size: 12px; }
  .data-field input:focus { outline: 1px solid #4a7fd9; }
  .extraction-notes { font-size: 11px; color: #8b93a7; font-style: italic; margin-top: 6px; padding: 6px 8px; background: #1a1d24; border-radius: 3px; }

  /* ── Meta-analysis ──────────────────────────────────────── */
  .meta-summary { background: #1a2332; color: #b3cfee; padding: 12px 16px; border-radius: 6px; font-size: 13px; line-height: 1.5; margin-bottom: 18px; }
  .outcome-result { border: 1px solid #2a2f3a; border-radius: 6px; padding: 16px; margin-bottom: 16px; background: #0f1115; }
  .outcome-result h4 { margin: 0 0 8px; font-size: 15px; color: #e6e6e6; }
  .effect-display { display: flex; align-items: baseline; gap: 12px; margin: 8px 0; }
  .effect-pooled { font-size: 22px; font-weight: 700; color: #b3cfee; }
  .effect-ci { font-size: 13px; color: #8b93a7; }
  .stats-row { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: #8b93a7; margin: 8px 0 12px; }
  .stat-item .stat-val { color: #e6e6e6; font-weight: 600; }
  .i-squared.low { color: #6bcf7f; }
  .i-squared.mod { color: #d9a84a; }
  .i-squared.high { color: #d97a7a; }
  .interpretation { padding: 8px 12px; border-radius: 4px; font-size: 13px; line-height: 1.5; margin-bottom: 12px; }
  .interpretation.intervention { background: #102a15; color: #6bcf7f; border-left: 3px solid #6bcf7f; }
  .interpretation.comparator { background: #2a1010; color: #d97a7a; border-left: 3px solid #d97a7a; }
  .interpretation.neutral { background: #1f232c; color: #b3b9c8; border-left: 3px solid #5a6070; }
  .forest-plot { margin-top: 10px; background: #ffffff; border-radius: 4px; padding: 8px; }
  .forest-plot img { max-width: 100%; display: block; }
  .forest-plot.missing { background: #1f232c; color: #5a6070; padding: 24px; text-align: center; font-size: 12px; font-style: italic; }
  .caveats { background: #2a2010; color: #f0c87a; padding: 10px 14px; border-radius: 6px; font-size: 12px; line-height: 1.6; margin-top: 12px; }
  .caveats h5 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: #d9a84a; }
  .caveats ul { margin: 4px 0 0; padding-left: 18px; }
  .excluded-studies { margin-top: 12px; font-size: 11px; color: #5a6070; }
  .card-tag.data_extraction { background: #2a1a10; color: #d9a84a; }
  .card-tag.meta_analysis { background: #142a30; color: #7adfdf; }
  .card-tag.query_blocks { background: #1c2532; color: #a3b3df; }
  .card-tag.strategy_result { background: #1c2532; color: #a3b3df; }
  .card-tag.protocol_methods { background: #1d2a1f; color: #a3dfa3; }
  .card-tag.protocol_document { background: #1d2a1f; color: #a3dfa3; }
  .card-tag.rob_assessments { background: #2a1d1d; color: #dfa3a3; }
  .card-tag.rob_summary { background: #2a1d1d; color: #dfa3a3; }

  /* ── risk_of_bias: assessments table ──────────────────────── */
  .rob-tool-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .rob-tool-pill { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; padding: 3px 9px; border-radius: 3px; font-weight: 700; background: #2a1d1d; color: #dfa3a3; }
  .rob-summary-box { background: #14181f; padding: 10px 12px; border-radius: 4px; font-size: 12px; color: #b3b9c8; line-height: 1.5; margin-bottom: 14px; border-left: 3px solid #5a6070; }

  .rob-study { border: 1px solid #2a2f3a; border-radius: 6px; padding: 12px 14px; margin-bottom: 12px; background: #0f1115; }
  .rob-study-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #1f232c; flex-wrap: wrap; }
  .rob-study-title { flex: 1; min-width: 220px; font-size: 13px; font-weight: 600; color: #e6e6e6; line-height: 1.4; }
  .rob-study-meta { font-size: 11px; color: #5a6070; margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; }
  .rob-study-meta a { color: #7aa7d9; text-decoration: none; }
  .rob-study-meta a:hover { text-decoration: underline; }
  .rob-overall-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .rob-overall-row .lbl { font-size: 10px; text-transform: uppercase; color: #5a6070; font-weight: 600; letter-spacing: .5px; }

  .judgment-pill { font-size: 10px; text-transform: uppercase; letter-spacing: .4px; padding: 2px 8px; border-radius: 3px; font-weight: 700; }
  .judgment-pill.low { background: #102a15; color: #6bcf7f; }
  .judgment-pill.some_concerns { background: #2a2010; color: #d9a84a; }
  .judgment-pill.high { background: #2a1010; color: #d97a7a; }
  .judgment-pill.no_information { background: #1f232c; color: #8b93a7; }
  .judgment-select { background: #1f232c; color: #e6e6e6; border: 1px solid #2a2f3a; border-radius: 4px; padding: 4px 6px; font: inherit; font-size: 12px; }
  .judgment-select.low { color: #6bcf7f; border-color: #1d3a25; }
  .judgment-select.some_concerns { color: #d9a84a; border-color: #3a3010; }
  .judgment-select.high { color: #d97a7a; border-color: #3a1010; }
  .judgment-select.no_information { color: #8b93a7; }

  .rob-domain-row { display: grid; grid-template-columns: 1.4fr 130px; gap: 10px; align-items: start; padding: 8px 0; border-bottom: 1px dashed #1f232c; }
  .rob-domain-row:last-child { border-bottom: 0; }
  .rob-domain-name { font-size: 12px; color: #b3b9c8; font-weight: 600; }
  .rob-domain-justify { grid-column: 1 / -1; font-size: 11px; color: #8b93a7; line-height: 1.5; padding: 4px 0; }
  .rob-domain-justify textarea { width: 100%; background: #14181f; color: #e6e6e6; border: 1px solid #1f232c; border-radius: 3px; padding: 6px 8px; font: inherit; font-size: 11px; min-height: 36px; resize: vertical; }
  .rob-domain-quote { grid-column: 1 / -1; font-size: 11px; color: #b3cfee; line-height: 1.4; padding: 6px 8px; background: #14182a; border-left: 2px solid #4a7fd9; border-radius: 3px; margin-top: 4px; font-style: italic; }
  .rob-domain-toggle { background: none; border: 0; color: #5a83b3; cursor: pointer; font-size: 11px; padding: 2px 0; text-decoration: underline; align-self: flex-start; }

  /* ── risk_of_bias: summary ────────────────────────────────── */
  .rob-plot { background: #ffffff; border-radius: 4px; padding: 8px; margin-bottom: 14px; }
  .rob-plot img { max-width: 100%; display: block; }
  .rob-plot.missing { background: #1f232c; color: #5a6070; padding: 24px; text-align: center; font-size: 12px; font-style: italic; border-radius: 4px; margin-bottom: 14px; }
  .rob-narrative { font-size: 13px; color: #e6e6e6; line-height: 1.6; padding: 12px 14px; background: #0f1115; border-radius: 4px; margin-bottom: 14px; border: 1px solid #1f232c; }
  .rob-sensitivity { padding: 10px 14px; border-radius: 4px; background: #2a2010; border-left: 3px solid #d9a84a; margin-bottom: 14px; }
  .rob-sensitivity h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: #d9a84a; font-weight: 700; }
  .rob-sensitivity ul { margin: 4px 0 0; padding-left: 18px; font-size: 12px; color: #e6e6e6; line-height: 1.6; }

<body>
<div id="root"></div>
<script type="text/babel">
const { useEffect, useRef, useState } = React;

/* Auth (Phase E): bounce to the Cognito login on any 401 from the API.
   /auth/* responses are excluded so the login check itself (/auth/me) and
   the OIDC round-trip don't trigger a redirect loop. Wraps window.fetch
   once so every call site is covered without per-call changes. */
(function installAuthFetch() {
  const orig = window.fetch.bind(window);
  let redirecting = false;
  window.fetch = async (input, init) => {
    const res = await orig(input, init);
    const url = typeof input === "string" ? input : (input && input.url) || "";
    if (res.status === 401 && !url.includes("/auth/") && !redirecting) {
      redirecting = true;
      const next = encodeURIComponent(location.pathname + location.search);
      location.href = "/auth/login?next=" + next;
    }
    return res;
  };
})();

/* FastAPI returns errors as {"detail": "..."} JSON. Surface the detail text
   directly so the user sees the friendly server message rather than the
   raw JSON envelope. */
function extractErrorMessage(text) {
  if (!text) return "Unknown error";
  try {
    const obj = JSON.parse(text);
    if (obj && typeof obj.detail === "string") return obj.detail;
  } catch { /* not JSON — fall through */ }
  return text;
}

/* Parse a stored final_answer string into a typed turn (or null). */
function parseTurn(raw) {
  if (!raw) return null;
  if (typeof raw === "object") return raw && raw.kind ? raw : null;
  try {
    const obj = JSON.parse(raw);
    return obj && obj.kind ? obj : null;
  } catch {
    return null;
  }
}

/* Format an edited PICO back into a structured user message that the agent
   can interpret as confirmation. The leading line is recognisable so the
   model knows the user has approved the PICO and wants to proceed. */
function formatPicoConfirmation(p) {
  const list = (xs) => (xs && xs.length ? xs.map(x => `  - ${x}`).join("\n") : "  - (none)");
  return [
    "PICO confirmed (proceed to STEP 3 — build PubMed search and run it):",
    "",
    `- Population: ${p.population || ""}`,
    `- Intervention: ${p.intervention || ""}`,
    `- Comparison: ${p.comparison || ""}`,
    "- Outcomes:",
    list(p.outcomes),
    "- Inclusion criteria:",
    list(p.inclusion_criteria),
    "- Exclusion criteria:",
    list(p.exclusion_criteria),
    `- Study types: ${(p.study_types || []).join(", ") || "(unspecified)"}`,
    `- Age range: ${p.age_range || "(unspecified)"}`,
    p.notes ? `- Notes: ${p.notes}` : null,
  ].filter(Boolean).join("\n");
}

/* Trigger STEP 4 — data extraction from selected PMIDs. */
function formatExtractionRequest(pmids) {
  return [
    `Selected studies for data extraction (${pmids.length} studies — proceed to STEP 4):`,
    "",
    ...pmids.map(p => `- PMID ${p}`),
    "",
    "Use the abstracts already in this conversation. Call fetch_pmc_fulltext only when an abstract lacks the numbers you need.",
  ].join("\n");
}

/* sr_protocol: confirm edited methods → STEP 3 (full document). The full
   methods structure is sent inline so the agent can carry it through to
   protocol_document.methods without re-deriving. */
function formatMethodsConfirmation(methods) {
  return [
    "Methods confirmed (proceed to STEP 3 — produce the full protocol_document with grounded background and PROSPERO field map):",
    "",
    "```json",
    JSON.stringify(methods, null, 2),
    "```",
  ].join("\n");
}

/* sr_protocol: finalize → STEP 5 (lock the document). */
function formatProtocolFinalize() {
  return "Finalize protocol — lock the current document as final and surface the search_strategy / meta_analysis hand-off buttons.";
}

/* sr_protocol → search_strategy hand-off. */
function formatSearchStrategyHandoff(methods) {
  const dbList = (methods.information_sources || []).join(", ");
  return [
    "I want to build the search strategy for this systematic-review protocol.",
    "",
    `Research question: ${methods.title}`,
    "",
    "PICO (already validated):",
    `- Population: ${methods.pico.population}`,
    `- Intervention: ${methods.pico.intervention}`,
    `- Comparison: ${methods.pico.comparison}`,
    `- Outcomes: ${(methods.pico.outcomes || []).join("; ")}`,
    "",
    `Planned databases: ${dbList || "PubMed, Embase, Cochrane CENTRAL"}.`,
    "",
    "Build me a Boolean PubMed query (the protocol already specifies eligibility filters) and generate per-database plans for each planned database.",
  ].join("\n");
}

/* meta_analysis → risk_of_bias hand-off: send the extracted studies and
   any PICO context found in the thread so the RoB agent can fetch fewer
   abstracts (or reuse them via the embedded payload). The continuation
   prefix "Run risk of bias on extracted" routes via the dispatcher. */
function formatRobOnExtractedStudies(studies, picoContext) {
  const studyPayload = (studies || []).map(s => {
    // Build a minimal abstract proxy from the extraction notes if no
    // abstract is present — the RoB agent will fetch via search_papers
    // when the field is empty/short.
    return {
      pmid: s.pmid || s.source_id || "",
      title: s.title || "",
      study_design: s.study_design || "Randomized Controlled Trial",
      abstract: s.abstract || s.extraction_notes || "",
    };
  }).filter(s => s.pmid);

  const lines = [
    "Run risk of bias on extracted studies (handoff payload follows).",
    "",
  ];
  if (picoContext) {
    lines.push(
      "PICO context (from prior thread, for tool selection only):",
      `- Population: ${picoContext.population || ""}`,
      `- Intervention: ${picoContext.intervention || ""}`,
      `- Comparison: ${picoContext.comparison || ""}`,
      `- Outcomes: ${(picoContext.outcomes || []).join("; ")}`,
      "",
    );
  }
  lines.push(
    `Studies (n=${studyPayload.length}):`,
    "```json",
    JSON.stringify(studyPayload, null, 2),
    "```",
  );
  return lines.join("\n");
}

/* risk_of_bias: confirm edited assessments → STEP 3 (summary plot). */
function formatRobConfirmation(tool, assessments) {
  return [
    "RoB confirmed — proceed to STEP 3 (compute domain_distribution and render the stacked-bar summary plot).",
    "",
    `Tool: ${tool}`,
    "",
    "Assessments (edited):",
    "```json",
    JSON.stringify(assessments, null, 2),
    "```",
  ].join("\n");
}

/* risk_of_bias: lock the summary. */
function formatRobFinalize() {
  return "Finalize RoB — lock the current summary as final and surface the meta-analysis sensitivity hand-off.";
}

/* risk_of_bias → meta_analysis sensitivity re-pool. The seed lists the
   high-RoB PMIDs to exclude and carries any PICO context found in the
   RoB thread's history (which itself usually came from a data_extraction
   handoff that already included PICO). */
function formatMetaAnalysisSensitivity(highRobPmids, picoContext) {
  const lines = [
    "Run a sensitivity meta-analysis EXCLUDING these high-RoB studies:",
    "",
    ...highRobPmids.map(p => `- PMID ${p}`),
    "",
  ];
  if (picoContext) {
    lines.push(
      "PICO (carried from the RoB thread, use as-is in STEP 2 — do not re-derive):",
      `- Population: ${picoContext.population || ""}`,
      `- Intervention: ${picoContext.intervention || ""}`,
      `- Comparison: ${picoContext.comparison || ""}`,
      `- Outcomes: ${(picoContext.outcomes || []).join("; ")}`,
    );
  } else {
    lines.push("(No PICO context available — please restate the research question in STEP 2.)");
  }
  return lines.join("\n");
}

/* Reconstruct a PicoTable-shaped object from query_blocks (search_strategy's
   PICO blocks). Used by the watch-creation modal so the backend gets a
   real PICO snapshot for the triage agent to anchor against. */
function picoFromQueryBlocks(blocks) {
  const concepts = (label) => (blocks || []).filter(b => b.label === label).map(b => b.concept);
  const first = (label) => { const xs = concepts(label); return xs[0] || ""; };
  return {
    population: first("population"),
    intervention: first("intervention"),
    comparison: first("comparison") || "(not specified)",
    outcomes: concepts("outcome"),
    inclusion_criteria: [],
    exclusion_criteria: [],
    study_types: [],
    age_range: null,
    notes: null,
  };
}

/* sr_protocol → meta_analysis hand-off. Skips the protocol's STEP 2 (PICO
   build) by handing the validated PICO over verbatim. */
function formatMetaAnalysisHandoffFromProtocol(methods) {
  return [
    "I want to run a meta-analysis using this validated protocol PICO.",
    "",
    `Title: ${methods.title}`,
    "",
    "PICO (already validated — use as-is in STEP 2, do not re-derive):",
    `- Population: ${methods.pico.population}`,
    `- Intervention: ${methods.pico.intervention}`,
    `- Comparison: ${methods.pico.comparison}`,
    `- Outcomes:`,
    ...(methods.pico.outcomes || []).map(o => `  - ${o}`),
    `- Inclusion criteria: ${(methods.pico.inclusion_criteria || []).join("; ")}`,
    `- Exclusion criteria: ${(methods.pico.exclusion_criteria || []).join("; ")}`,
    `- Study types: ${(methods.pico.study_types || []).join(", ")}`,
    `- Age range: ${methods.pico.age_range || "(unspecified)"}`,
  ].join("\n");
}

/* Search-strategy: confirm edited query blocks → STEP 3 (compose & test). */
function formatQueryConfirmation(blocks, targetBand) {
  const list = (xs) => (xs && xs.length ? xs.map(x => `  - ${x}`).join("\n") : "  - (none)");
  const lines = [
    "Confirmed query terms (proceed to STEP 3 — compose, run search_papers, and return strategy_result):",
    "",
    `Target hit-count band: ${targetBand[0]}–${targetBand[1]} PubMed hits`,
    "",
  ];
  for (const b of blocks) {
    lines.push(`- ${b.label.toUpperCase()} — ${b.concept}`);
    lines.push("  MeSH:");
    lines.push(list((b.mesh_terms || []).map(m => `${m.descriptor} (UID ${m.mesh_id})`)));
    lines.push("  Free-text synonyms:");
    lines.push(list(b.free_text_synonyms || []));
    lines.push(`  Composed: ${b.composed}`);
  }
  return lines.join("\n");
}

/* Search-strategy: refinement click → STEP 4 (iterate). */
function formatRefinementClick(continuation) {
  // The Refinement schema requires `continuation` to start with "Tighten:" or
  // "Broaden:" — send it verbatim so the dispatcher routes back to us.
  return continuation;
}

/* Search-strategy: finalize → STEP 5 (lock the strategy). */
function formatFinalize() {
  return "Finalize strategy — lock the current query as final and surface the meta-analysis hand-off.";
}

/* Search-strategy → meta-analysis hand-off. The seed deliberately includes
   the validated PubMed query so the meta-analysis specialist can reuse it
   verbatim in its STEP 3 instead of re-deriving from MeSH. */
function formatMetaAnalysisHandoff(researchQuestion, pubmedQuery) {
  return [
    "I want to run a meta-analysis on this clinical question:",
    "",
    researchQuestion,
    "",
    "I have already validated this PubMed search query in a previous step — use it as-is in STEP 3 (or refine if you find issues, but skip rebuilding from MeSH unless necessary):",
    "",
    "```",
    pubmedQuery,
    "```",
  ].join("\n");
}

/* Trigger STEP 5 — meta-analysis. The full extracted data is sent inline so the
   agent can pass it through to sandbox_exec via input_data. */
function formatExtractionConfirmation(studies) {
  return [
    "Confirmed extracted data (proceed to STEP 5 — run meta-analysis):",
    "",
    "```json",
    JSON.stringify({ studies }, null, 2),
    "```",
  ].join("\n");
}

const SELECTION_MAX = 20;

/* ── App ─────────────────────────────────────────────────── */

function App() {
  const [health, setHealth] = useState(null);
  const [me, setMe] = useState(null);
  const [threads, setThreads] = useState([]);
  const [activeThreadId, setActiveThreadId] = useState(null);
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [running, setRunning] = useState(false);
  const [error, setError] = useState(null);
  const [view, setView] = useState("chat");
  const [usageData, setUsageData] = useState(null);
  const [notifs, setNotifs] = useState([]);
  const [notifCount, setNotifCount] = useState(0);
  const [bellOpen, setBellOpen] = useState(false);
  const [watchModal, setWatchModal] = useState(null);  // { pubmedQuery, sampleHitPmids, picoSeed } or null
  const conversationRef = useRef(null);

  useEffect(() => {
    fetch("/api/health").then(r => r.json()).then(setHealth).catch(() => {});
    fetch("/auth/me").then(r => r.ok ? r.json() : null).then(setMe).catch(() => setMe(null));
    loadThreads();
  }, []);

  useEffect(() => {
    if (conversationRef.current) conversationRef.current.scrollTop = conversationRef.current.scrollHeight;
  }, [messages, running]);

  async function loadThreads() {
    try { setThreads(await (await fetch("/api/threads")).json()); } catch {}
  }
  async function loadMessages(threadId) {
    try { setMessages(await (await fetch(`/api/threads/${threadId}/messages`)).json()); } catch {}
  }
  async function loadUsage() {
    try { setUsageData(await (await fetch("/api/threads/usage/monthly")).json()); } catch {}
  }

  async function loadNotifications() {
    try {
      const res = await fetch("/api/notifications?limit=10");
      if (res.ok) setNotifs(await res.json());
      const c = await fetch("/api/notifications/unread-count");
      if (c.ok) setNotifCount((await c.json()).count || 0);
    } catch {}
  }

  useEffect(() => {
    loadNotifications();
    const t = setInterval(loadNotifications, 30000);
    return () => clearInterval(t);
  }, []);

  async function markNotifRead(id) {
    try { await fetch(`/api/notifications/${id}/read`, { method: "POST" }); } catch {}
    await loadNotifications();
  }

  async function createThread() {
    try {
      const t = await (await fetch("/api/threads", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title: "New conversation" }),
      })).json();
      setActiveThreadId(t.id);
      setMessages([]);
      setError(null);
      setView("chat");
      await loadThreads();
    } catch {}
  }

  async function selectThread(threadId) {
    setActiveThreadId(threadId);
    setMessages([]);
    setError(null);
    setView("chat");
    await loadMessages(threadId);
  }

  async function deleteThread(e, threadId) {
    e.stopPropagation();
    try {
      await fetch(`/api/threads/${threadId}`, { method: "DELETE" });
      if (activeThreadId === threadId) { setActiveThreadId(null); setMessages([]); }
      await loadThreads();
    } catch {}
  }

  function openUsage() { setActiveThreadId(null); setView("usage"); loadUsage(); }

  /* Send a user message; on the very first send the thread is auto-created. */
  async function sendMessage(text) {
    const body = text.trim();
    if (!body || running) return;

    let threadId = activeThreadId;
    if (!threadId) {
      try {
        const t = await (await fetch("/api/threads", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title: body.slice(0, 120) }),
        })).json();
        threadId = t.id;
        setActiveThreadId(threadId);
        setView("chat");
        await loadThreads();
      } catch (e) { setError(`Could not start thread: ${e}`); return; }
    }

    setRunning(true);
    setError(null);
    setInput("");

    /* Optimistic user message bubble */
    setMessages(prev => [...prev, {
      id: `tmp-${Date.now()}`, role: "user",
      input_text: body, final_answer: null, created_at: new Date().toISOString(),
    }]);

    try {
      const res = await fetch("/api/turn", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ thread_id: threadId, user_message: body }),
      });
      if (!res.ok) {
        const errText = (await res.text()) || res.statusText;
        throw new Error(extractErrorMessage(errText));
      }
      await loadMessages(threadId);
      await loadThreads();
    } catch (e) {
      setError(`Agent error: ${e.message || e}`);
      /* Drop the optimistic bubble on error so the user can retry. */
      await loadMessages(threadId);
    } finally {
      setRunning(false);
    }
  }

  /* Generic hand-off helper: create a thread, switch to it, auto-send the seed.
     Used by both search_strategy → meta_analysis and sr_protocol → {search_strategy, meta_analysis}. */
  async function _runHandoff(threadTitle, seed) {
    if (running) return;
    setError(null);
    let newThreadId = null;
    try {
      const t = await (await fetch("/api/threads", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title: threadTitle.slice(0, 120) }),
      })).json();
      newThreadId = t.id;
      setActiveThreadId(newThreadId);
      setView("chat");
      setMessages([{
        id: `tmp-${Date.now()}`, role: "user",
        input_text: seed, final_answer: null, created_at: new Date().toISOString(),
      }]);
      await loadThreads();
    } catch (e) {
      setError(`Hand-off failed: ${e.message || e}`);
      return;
    }
    setRunning(true);
    try {
      const res = await fetch("/api/turn", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ thread_id: newThreadId, user_message: seed }),
      });
      if (!res.ok) throw new Error(extractErrorMessage(await res.text()));
      await loadMessages(newThreadId);
      await loadThreads();
    } catch (e) {
      setError(`Agent error: ${e.message || e}`);
      await loadMessages(newThreadId);
    } finally {
      setRunning(false);
    }
  }

  /* sr_protocol → search_strategy hand-off. */
  async function handoffToSearchStrategy(methods) {
    const seed = formatSearchStrategyHandoff(methods);
    await _runHandoff(`Search strategy: ${methods.title.slice(0, 80)}`, seed);
  }

  /* Look up the most recent PICO context in `messages` for cross-thread carryover.
     Searches assistant turns for: pico (meta_analysis), protocol_methods
     (sr_protocol), or query_blocks (search_strategy → derived PICO). Returns
     a PicoTable-shaped object or null. */
  function findPicoFromMessages() {
    for (let i = messages.length - 1; i >= 0; i--) {
      const m = messages[i];
      if (m.role !== "assistant") continue;
      const t = parseTurn(m.final_answer);
      if (!t) continue;
      if (t.kind === "pico" && t.pico) return t.pico;
      if (t.kind === "protocol_methods" && t.pico) return t.pico;
      if (t.kind === "query_blocks" && Array.isArray(t.blocks)) {
        return picoFromQueryBlocks(t.blocks);
      }
    }
    // Last resort: a user-message handoff seed sometimes has PICO inline.
    // Skip that for v1 — null tells the seed builder to ask the user.
    return null;
  }

  /* meta_analysis (data_extraction card) → risk_of_bias hand-off. */
  async function handoffToRobFromExtraction(studies) {
    const pico = findPicoFromMessages();
    const seed = formatRobOnExtractedStudies(studies, pico);
    const title = pico
      ? `Risk of bias: ${(pico.intervention || "studies").slice(0, 80)}`
      : `Risk of bias (n=${(studies || []).length} studies)`;
    await _runHandoff(title, seed);
  }

  /* risk_of_bias (rob_summary card, is_final=true) → meta_analysis sensitivity re-pool. */
  async function handoffRobToMetaSensitivity(highRobPmids) {
    const pico = findPicoFromMessages();
    const seed = formatMetaAnalysisSensitivity(highRobPmids, pico);
    const title = pico
      ? `Meta-analysis (sensitivity): ${(pico.intervention || "").slice(0, 80)}`
      : "Meta-analysis (sensitivity, excluding high-RoB studies)";
    await _runHandoff(title, seed);
  }

  /* sr_protocol → meta-analysis hand-off (PICO pre-loaded, skip protocol PICO build). */
  async function handoffProtocolToMetaAnalysis(methods) {
    const seed = formatMetaAnalysisHandoffFromProtocol(methods);
    await _runHandoff(`Meta-analysis: ${methods.title.slice(0, 80)}`, seed);
  }

  /* Open the "Watch this query" modal, seeding it with the validated
     PubMed query, sample hits as baseline, and a PICO reconstructed from
     the most recent query_blocks turn in the thread. */
  function openWatchModal(pubmedQuery, sampleHitPmids) {
    let blocks = null;
    let researchQuestion = "";
    for (let i = messages.length - 1; i >= 0; i--) {
      const m = messages[i];
      if (m.role === "assistant") {
        const t = parseTurn(m.final_answer);
        if (t && t.kind === "query_blocks" && Array.isArray(t.blocks)) {
          blocks = t.blocks;
          researchQuestion = t.research_question || "";
          break;
        }
      }
    }
    const picoSeed = blocks ? picoFromQueryBlocks(blocks) : {
      population: "", intervention: "", comparison: "(not specified)",
      outcomes: [], inclusion_criteria: [], exclusion_criteria: [],
      study_types: [], age_range: null, notes: null,
    };
    setWatchModal({
      pubmedQuery,
      sampleHitPmids: sampleHitPmids || [],
      picoSeed,
      defaultName: researchQuestion ? `Watch: ${researchQuestion.slice(0, 80)}` : "",
    });
  }

  /* Search-strategy → meta-analysis hand-off. Creates a fresh thread,
     switches to it, then auto-sends the seed message containing the
     research question (looked up from the most recent query_blocks turn,
     or the user's first message in this thread) + validated PubMed query. */
  async function handoffToMetaAnalysis(pubmedQuery) {
    let researchQuestion = "";
    for (let i = messages.length - 1; i >= 0; i--) {
      const m = messages[i];
      if (m.role === "assistant") {
        const t = parseTurn(m.final_answer);
        if (t && t.kind === "query_blocks" && t.research_question) {
          researchQuestion = t.research_question;
          break;
        }
      }
    }
    if (!researchQuestion) {
      const firstUser = messages.find(m => m.role === "user");
      if (firstUser) researchQuestion = firstUser.input_text;
    }
    if (!researchQuestion) researchQuestion = "(see prior conversation)";
    const seed = formatMetaAnalysisHandoff(researchQuestion, pubmedQuery);
    await _runHandoff(`Meta-analysis: ${researchQuestion.slice(0, 100)}`, seed);
  }

  function formatTime(iso) {
    try {
      const d = new Date(iso);
      const now = new Date();
      if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      return d.toLocaleDateString([], { month: "short", day: "numeric" });
    } catch { return ""; }
  }

  return (
    <>
      <div className="sidebar">
        <div className="sidebar-top">
          <h2>Clinical Research Asst.</h2>
          <button className="new-thread-btn" onClick={createThread}>+ New Thread</button>
        </div>
        <div className="thread-list">
          {threads.length === 0 && <div className="empty-threads">No conversations yet</div>}
          {threads.map(t => (
            <div key={t.id} className={`thread-item ${view === "chat" && activeThreadId === t.id ? "active" : ""}`} onClick={() => selectThread(t.id)}>
              <div style={{ display: "flex", alignItems: "center" }}>
                <span className="thread-title">{t.title}</span>
                <span className="thread-actions">
                  <button className="thread-delete" onClick={e => deleteThread(e, t.id)} title="Delete">x</button>
                </span>
              </div>
              <div className="thread-meta">
                <span>{formatTime(t.updated_at)}</span>
                <span>{t.message_count} msgs</span>
                {t.workflow && <span className={`workflow-pill ${t.workflow}`}>{t.workflow.replace("_", " ")}</span>}
              </div>
            </div>
          ))}
        </div>
        <div className="sidebar-bottom">
          <div className="bell-row">
            <button className="sidebar-link" onClick={() => setBellOpen(o => !o)}>
              ◉ Notifications
              <span className={`bell-badge ${notifCount === 0 ? "zero" : ""}`}>{notifCount}</span>
            </button>
            {bellOpen && (
              <div className="notif-dropdown">
                {notifs.length === 0 && <div className="notif-empty">No notifications yet. Create a watch from a finalised search strategy.</div>}
                {notifs.map(n => (
                  <div
                    key={n.id}
                    className={`notif-item ${n.read_at ? "read" : "unread"}`}
                    onClick={() => { setBellOpen(false); markNotifRead(n.id); window.location.href = "/watches.html"; }}
                  >
                    <div className="notif-title">{n.title}</div>
                    <div className="notif-summary">{n.summary}</div>
                    <div className="notif-meta">
                      <span>{n.watch_name}</span>
                      <span>·</span>
                      <span>{n.new_paper_count} new</span>
                      <span>·</span>
                      <span>{formatTime(n.created_at)}</span>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
          <a className="sidebar-link" href="/library.html">▥ Library</a>
          <a className="sidebar-link" href="/watches.html">▤ Watches</a>
          <button className="sidebar-link" onClick={openUsage} style={view === "usage" ? { background: "#1f232c", color: "#e6e6e6" } : {}}>
            ~ Usage
          </button>
          {me && (me.sub === "default-user" || (me.roles || []).includes("admin")) && (
            <a className="sidebar-link" href="/admin.html">⚙ Settings</a>
          )}
          <div className="sidebar-divider" />
          <a className="sidebar-link" href="https://www.ncbi.nlm.nih.gov/books/NBK25501/" target="_blank" rel="noopener">? E-utilities Docs</a>
          <a className="sidebar-link" href="https://www.nlm.nih.gov/mesh/meshhome.html" target="_blank" rel="noopener">? MeSH Home</a>
          <a className="sidebar-link" href="https://ai.pydantic.dev/latest/" target="_blank" rel="noopener">? Pydantic AI Docs</a>
          <div className="sidebar-divider" />
          {me && me.sub !== "default-user" ? (
            <>
              <div className="sidebar-link" style={{ cursor: "default", fontSize: "12px", color: "#8b93a7" }} title={me.email}>
                ◷ {me.email}
              </div>
              <form method="post" action="/auth/logout" style={{ margin: 0 }}>
                <button type="submit" className="sidebar-link">⎋ Log out</button>
              </form>
            </>
          ) : me && me.sub === "default-user" ? null : (
            <a className="sidebar-link" href="/auth/login">⇥ Log in</a>
          )}
          <div className="sidebar-link" style={{ cursor: "default", fontSize: "11px", color: "#3a3f4a" }}>{health ? health.model : "..."}</div>
        </div>
      </div>

      <div className="main">
        <div className="header">
          <h1>Clinical Research Assistant</h1>
          <div className="health">{health ? `${health.model} · ${health.region}` : "..."}</div>
        </div>

        {view === "usage" ? (
          <UsagePage data={usageData} />
        ) : !activeThreadId ? (
          <div className="welcome">
            <h2>Welcome</h2>
            <p>Start a new thread to draft a review protocol, build a database search strategy, or run a meta-analysis end-to-end.</p>
            <p style={{ marginTop: 16, color: "#5a6070" }}>The assistant supports:</p>
            <ul>
              <li><strong>Protocol draft</strong> — research question → PRISMA-P methods (PICO + eligibility + RoB tool + synthesis plan) → full document with grounded background + PROSPERO field map. Try <code>/protocol</code>.</li>
              <li><strong>Search strategy</strong> — research question → MeSH-expanded Boolean query, tested on PubMed + Europe PMC, with copy-paste plans for Cochrane CENTRAL and Embase. Try <code>/search</code>.</li>
              <li><strong>Meta-analysis</strong> — clinical question → PICO → search → extraction → pooled effects + forest plots. Try <code>/meta</code>.</li>
              <li><strong>Anti-hallucination</strong> — every PMID, MeSH term, and citation is grounded in a real tool call</li>
            </ul>
          </div>
        ) : (
          <>
            <div className="conversation" ref={conversationRef}>
              {messages.map(m => (
                <Turn key={m.id} message={m} onSend={sendMessage} onHandoff={handoffToMetaAnalysis} onHandoffProtocolToSearch={handoffToSearchStrategy} onHandoffProtocolToMeta={handoffProtocolToMetaAnalysis} onWatch={openWatchModal} onHandoffToRob={handoffToRobFromExtraction} onHandoffRobToMeta={handoffRobToMetaSensitivity} running={running} />
              ))}
              {running && <div className="turn"><div className="loading"><div className="spinner" />Agent is thinking…</div></div>}
              {error && <div className="turn"><div className="error-banner">{error}</div></div>}
            </div>
            <div className="composer">
              <div className="composer-row">
                <textarea
                  className="composer-input"
                  value={input}
                  placeholder="Describe your clinical question, or answer the assistant's last question…"
                  onChange={e => setInput(e.target.value)}
                  onKeyDown={e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); sendMessage(input); } }}
                  disabled={running}
                />
                <button className="btn-primary" onClick={() => sendMessage(input)} disabled={running || !input.trim()}>
                  {running ? "Working…" : "Send"}
                </button>
              </div>
            </div>
          </>
        )}
      </div>
      {watchModal && (
        <WatchModal
          spec={watchModal}
          onClose={() => setWatchModal(null)}
          onCreated={() => { setWatchModal(null); loadNotifications(); }}
        />
      )}
    </>
  );
}

/* ── Single conversation turn (user bubble OR assistant card) ──────────── */

function Turn({ message, onSend, onHandoff, onHandoffProtocolToSearch, onHandoffProtocolToMeta, onWatch, onHandoffToRob, onHandoffRobToMeta, running }) {
  if (message.role === "user") {
    return (
      <div className="turn">
        <div className="turn-user">
          <div className="role-tag">You</div>
          {message.input_text}
        </div>
      </div>
    );
  }
  /* assistant */
  const turn = parseTurn(message.final_answer);
  if (!turn) {
    /* legacy / plain-text answer */
    return (
      <div className="turn">
        <div className="card">
          <div className="card-header"><span className="card-tag answer">Answer</span></div>
          <div style={{ whiteSpace: "pre-wrap" }}>{message.final_answer}</div>
        </div>
      </div>
    );
  }
  const KNOWN_KINDS = new Set([
    "clarification", "pico", "search_results", "data_extraction",
    "meta_analysis", "answer", "query_blocks", "strategy_result",
    "protocol_methods", "protocol_document",
    "rob_assessments", "rob_summary",
  ]);
  return (
    <div className="turn">
      <TurnErrorBoundary turn={turn}>
        {turn.kind === "clarification"    && <ClarificationCard turn={turn} onSend={onSend} disabled={running} />}
        {turn.kind === "pico"             && <PicoCard turn={turn} onSend={onSend} disabled={running} />}
        {turn.kind === "search_results"   && <SearchResultsCard turn={turn} onSend={onSend} disabled={running} />}
        {turn.kind === "data_extraction"  && <DataExtractionCard turn={turn} onSend={onSend} onHandoffToRob={onHandoffToRob} disabled={running} />}
        {turn.kind === "meta_analysis"    && <MetaAnalysisCard turn={turn} />}
        {turn.kind === "answer"           && <AnswerCard turn={turn} />}
        {turn.kind === "query_blocks"     && <QueryBlocksCard turn={turn} onSend={onSend} disabled={running} />}
        {turn.kind === "strategy_result"  && <StrategyResultCard turn={turn} onSend={onSend} onHandoff={onHandoff} onWatch={onWatch} disabled={running} />}
        {turn.kind === "protocol_methods" && <ProtocolMethodsCard turn={turn} onSend={onSend} disabled={running} />}
        {turn.kind === "protocol_document" && <ProtocolDocumentCard turn={turn} onSend={onSend} onHandoffSearch={onHandoffProtocolToSearch} onHandoffMeta={onHandoffProtocolToMeta} disabled={running} />}
        {turn.kind === "rob_assessments"  && <RobAssessmentsCard turn={turn} onSend={onSend} disabled={running} />}
        {turn.kind === "rob_summary"      && <RobSummaryCard turn={turn} onSend={onSend} onHandoffRobToMeta={onHandoffRobToMeta} disabled={running} />}
        {!KNOWN_KINDS.has(turn.kind)      && <UnknownTurnCard turn={turn} />}
      </TurnErrorBoundary>
    </div>
  );
}

/* Per-turn boundary — a JSX bug in one card no longer blanks the whole
   conversation. Renders the raw turn JSON + the error so we can debug. */
class TurnErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  componentDidCatch(err, info) { console.error("[turn render] crashed:", err, info, this.props.turn); }
  render() {
    if (!this.state.err) return this.props.children;
    return (
      <div className="card">
        <div className="card-header">

function ListField({ label, values, onChange, full, placeholder }) {

/* ── Search results ─────────────────────────────────────────────────────── */

function SearchResultsCard({ turn, onSend, disabled }) {
  const [selected, setSelected] = useState(() => new Set());

  const toggle = (pmid) => {
    setSelected(prev => {
      const next = new Set(prev);
      if (next.has(pmid)) next.delete(pmid); else next.add(pmid);
      return next;
    });
  };

  const count = selected.size;
  const tooFew = count < SELECTION_MIN;
  const tooMany = count > SELECTION_MAX;
  const canExtract = !tooFew && !tooMany && !disabled;

  function selectionMessage() {
    if (count === 0) return `Select ${SELECTION_MIN}–${SELECTION_MAX} studies to proceed to data extraction`;
    if (tooFew) return `Selected ${count} — need at least ${SELECTION_MIN} for meta-analysis`;
    if (tooMany) return `Selected ${count} — cap is ${SELECTION_MAX}; un-tick some studies`;
    return `Selected ${count} — ready to extract data`;
  }

  function selectionClass() {
    if (tooFew && count > 0) return "warn";
    if (tooMany) return "error";
    return "";
  }

  function submitExtraction() {
    if (!canExtract) return;
    onSend(formatExtractionRequest([...selected]));
  }

  return (
    <div className="card">
      <div className="card-header">
        <h3>Search Results</h3>
        <span className="card-tag search_results">search_results</span>
      </div>

      <div className="strategy-block">
        <div className="label">PubMed query</div>
        <div className="strategy-query">{turn.strategy.pubmed_query}</div>
        {turn.strategy.filters && turn.strategy.filters.length > 0 && (
          <div className="filter-chips">
            {turn.strategy.filters.map((f, i) => <span key={i} className="chip">{f}</span>)}
          </div>
        )}
        {turn.strategy.rationale && (
          <div style={{ color: "#8b93a7", fontSize: 12, marginTop: 8, lineHeight: 1.5 }}>{turn.strategy.rationale}</div>
        )}
      </div>

      <div className="selection-bar">
        <span className={`selection-count ${selectionClass()}`}>{selectionMessage()}</span>
        <button className="btn-primary" onClick={submitExtraction} disabled={!canExtract}>
          Extract data from selected ({count})
        </button>
      </div>

      <div style={{ fontSize: 13, color: "#8b93a7", marginBottom: 10 }}>
        Showing {turn.studies.length} of {turn.total_found} matching studies
      </div>

      {turn.studies.map(s => (
        <StudyCard key={s.pmid} study={s} selected={selected.has(s.pmid)} onToggle={() => toggle(s.pmid)} />
      ))}

      {turn.notes && <div className="rationale">{turn.notes}</div>}
    </div>
  );
}

/* ── Data extraction ──────────────────────────────────────────────────── */

const BINARY_MEASURES = new Set(["OR", "RR"]);

function isOutcomeComplete(o) {
  if (BINARY_MEASURES.has(o.effect_measure)) {
    return [o.events_intervention, o.n_intervention, o.events_comparison, o.n_comparison]
      .every(v => v !== null && v !== undefined && v !== "");
  }
  return [o.mean_intervention, o.sd_intervention, o.n_intervention,
          o.mean_comparison,   o.sd_comparison,   o.n_comparison]
    .every(v => v !== null && v !== undefined && v !== "");
}

function DataExtractionCard({ turn, onSend, onHandoffToRob, disabled }) {
  const [studies, setStudies] = useState(() => structuredClone(turn.studies));

  function updateOutcome(studyIdx, outcomeIdx, patch) {
    setStudies(prev => {
      const next = structuredClone(prev);
      const o = { ...next[studyIdx].outcomes[outcomeIdx], ...patch };
      // Any user edit flips the source badge.
      if (Object.keys(patch).some(k => k !== "is_complete")) {
        o.extraction_source = "user_provided";
      }
      o.is_complete = isOutcomeComplete(o);
      next[studyIdx].outcomes[outcomeIdx] = o;
      return next;
    });
  }

  const totalRows = studies.reduce((a, s) => a + s.outcomes.length, 0);
  const completeRows = studies.reduce(
    (a, s) => a + s.outcomes.filter(o => o.is_complete).length, 0);

  function submit() {
    if (disabled) return;
    onSend(formatExtractionConfirmation(studies));
  }

  return (
    <div className="card">
      <div className="card-header">
        <h3>Data Extraction</h3>
        <span className="card-tag data_extraction">data_extraction</span>
      </div>

      {turn.summary && <div className="extraction-summary">{turn.summary}</div>}

      <div className="extraction-helper">
        <strong>Tip:</strong> If a study's data is incomplete, click its PMID
        link to open the PubMed page, fetch the full PDF (or supplementary
        tables), and paste the missing numbers directly. Any field you edit
        is tagged <span className="source-badge user_provided">USER</span>{" "}
        so the analysis layer knows you supplied it.
      </div>

      {studies.map((study, si) => (
        <div className="extract-study" key={study.pmid}>
          <div className="extract-study-header">
            <div className="extract-study-title">
              <a href={`https://pubmed.ncbi.nlm.nih.gov/${study.pmid}/`} target="_blank" rel="noopener">{study.title}</a>
              <div className="extract-meta">
                <a href={`https://pubmed.ncbi.nlm.nih.gov/${study.pmid}/`} target="_blank" rel="noopener" className="study-link">PMID {study.pmid}</a>
                {study.doi && <> · <a href={`https://doi.org/${study.doi}`} target="_blank" rel="noopener" className="study-link">Open at publisher</a></>}
                {study.pmc_id && <> · <a href={`https://www.ncbi.nlm.nih.gov/pmc/articles/${study.pmc_id}/`} target="_blank" rel="noopener" className="study-link">PMC full text</a></>}
                {study.study_design && <> · {study.study_design}</>}
                {study.follow_up && <> · follow-up {study.follow_up}</>}
              </div>
            </div>
          </div>
          {(study.extraction_warnings || []).length > 0 && (
            <div className="extraction-notes" style={{ color: "#d9a84a" }}>
              ⚠ {study.extraction_warnings.join("; ")}
            </div>
          )}
          {study.outcomes.map((o, oi) => (
            <OutcomeRow
              key={`${study.pmid}-${o.outcome}-${oi}`}
              outcome={o}
              onChange={patch => updateOutcome(si, oi, patch)}
            />
          ))}
        </div>
      ))}

      <div className="card-actions">
        <button className="btn-primary" onClick={submit} disabled={disabled || completeRows === 0}>
          Run meta-analysis ({completeRows}/{totalRows} rows complete)
        </button>
        <button
          className="btn-secondary"
          onClick={() => onHandoffToRob && onHandoffToRob(studies)}
          disabled={disabled || !onHandoffToRob || studies.length === 0}
          title="Spawn a risk_of_bias thread with these studies pre-loaded."
        >
          Assess risk of bias
        </button>
        <button className="btn-secondary" onClick={() => setStudies(structuredClone(turn.studies))} disabled={disabled}>
          Reset edits
        </button>
      </div>
    </div>
  );
}

function OutcomeRow({ outcome, onChange }) {
  const isBinary = BINARY_MEASURES.has(outcome.effect_measure);
  const setNum = (k) => (e) => {
    const v = e.target.value;
    onChange({ [k]: v === "" ? null : Number(v) });
  };
  const setEffect = (e) => onChange({ effect_measure: e.target.value });

  return (
    <div className="outcome-row">
      <div className="outcome-header">
        <span className="outcome-name">{outcome.outcome}</span>
        <select className="effect-select" value={outcome.effect_measure} onChange={setEffect}>
          <option value="OR">OR (odds ratio)</option>
          <option value="RR">RR (risk ratio)</option>
          <option value="MD">MD (mean difference)</option>
          <option value="SMD">SMD (standardised MD)</option>
        </select>
        <span className={`source-badge ${outcome.extraction_source || "abstract"}`}>
          {(outcome.extraction_source || "abstract").replace("_", " ")}
        </span>
        <span className={`complete-flag ${outcome.is_complete ? "ok" : "warn"}`}>
          {outcome.is_complete ? "complete" : "needs data"}
        </span>
      </div>

      {isBinary ? (
        <div className="data-grid">
          <NumField label="Events (intervention)" value={outcome.events_intervention} onChange={setNum("events_intervention")} />
          <NumField label="N (intervention)"       value={outcome.n_intervention}       onChange={setNum("n_intervention")} />
          <NumField label="Events (comparison)"  value={outcome.events_comparison}  onChange={setNum("events_comparison")} />
          <NumField label="N (comparison)"        value={outcome.n_comparison}        onChange={setNum("n_comparison")} />
        </div>
      ) : (
        <div className="data-grid">
          <NumField label="Mean (intervention)" value={outcome.mean_intervention} onChange={setNum("mean_intervention")} />
          <NumField label="SD (intervention)"   value={outcome.sd_intervention}   onChange={setNum("sd_intervention")} />
          <NumField label="N (intervention)"    value={outcome.n_intervention}    onChange={setNum("n_intervention")} />
          <NumField label="Mean (comparison)"  value={outcome.mean_comparison}  onChange={setNum("mean_comparison")} />
          <NumField label="SD (comparison)"    value={outcome.sd_comparison}    onChange={setNum("sd_comparison")} />
          <NumField label="N (comparison)"     value={outcome.n_comparison}     onChange={setNum("n_comparison")} />
        </div>
      )}

      {outcome.extraction_notes && (
        <div className="extraction-notes">{outcome.extraction_notes}</div>
      )}
    </div>
  );
}

function NumField({ label, value, onChange }) {
  return (
    <div className="data-field">
      <label>{label}</label>
      <input type="number" step="any" value={value === null || value === undefined ? "" : value} onChange={onChange} />
    </div>
  );
}

/* ── Meta-analysis ────────────────────────────────────────────────────── */

function MetaAnalysisCard({ turn }) {
  return (
    <div className="card">
      <div className="card-header">
        <h3>Meta-Analysis Results</h3>
        <span className="card-tag meta_analysis">meta_analysis</span>
      </div>

      {turn.summary && <div className="meta-summary">{turn.summary}</div>}

      {turn.outcome_results.map((r, i) => <OutcomeResult key={i} result={r} />)}

      {turn.studies_excluded && turn.studies_excluded.length > 0 && (
        <div className="excluded-studies">
          Excluded from analysis: {turn.studies_excluded.map(e => `${e.pmid} (${e.reason})`).join("; ")}
        </div>
      )}

      {turn.caveats && turn.caveats.length > 0 && (
        <div className="caveats">
          <h5>Caveats</h5>
          <ul>{turn.caveats.map((c, i) => <li key={i}>{c}</li>)}</ul>
        </div>
      )}
    </div>
  );
}

function OutcomeResult({ result }) {
  const interp = (result.interpretation || "").toLowerCase();
  const interpClass =
    /favours\s+intervention|favors\s+intervention/.test(interp) ? "intervention" :
    /favours\s+comparator|favors\s+comparator/.test(interp)     ? "comparator"   : "neutral";

  const i2 = result.i_squared;
  const i2Class = i2 == null ? "" : i2 < 25 ? "low" : i2 < 75 ? "mod" : "high";

  const isImage = (result.forest_plot_image || "").startsWith("data:image/");

  return (
    <div className="outcome-result">
      <h4>{result.outcome} <span style={{ fontSize: 12, color: "#8b93a7", fontWeight: 400 }}>({result.effect_measure})</span></h4>
      <div className="effect-display">
        <span className="effect-pooled">{result.pooled_effect.toFixed(2)}</span>
        <span className="effect-ci">95% CI [{result.ci_lower.toFixed(2)}, {result.ci_upper.toFixed(2)}]</span>
      </div>
      <div className="stats-row">
        {i2 != null && (
          <span className="stat-item">I²: <span className={`stat-val i-squared ${i2Class}`}>{i2.toFixed(0)}%</span></span>
        )}
        {result.heterogeneity_p != null && (
          <span className="stat-item">heterogeneity p: <span className="stat-val">{result.heterogeneity_p.toFixed(3)}</span></span>
        )}
        {result.p_value != null && (
          <span className="stat-item">p: <span className="stat-val">{result.p_value.toFixed(3)}</span></span>
        )}
        <span className="stat-item">studies: <span className="stat-val">{result.n_studies}</span></span>
        <span className="stat-item">n: <span className="stat-val">{result.n_participants.toLocaleString()}</span></span>
      </div>
      <div className={`interpretation ${interpClass}`}>{result.interpretation}</div>
      {result.forest_plot_image ? (
        isImage
          ? <div className="forest-plot"><img src={result.forest_plot_image} alt={`Forest plot for ${result.outcome}`} /></div>
          : <div className="forest-plot missing">Forest plot file '{result.forest_plot_image}' was referenced but not produced by sandbox_exec.</div>
      ) : (
        <div className="forest-plot missing">No forest plot generated for this outcome.</div>
      )}
    </div>
  );
}
