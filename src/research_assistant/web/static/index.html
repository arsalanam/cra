/* ── Search-strategy: query-blocks editor ─────────────────────────────── */

function QueryBlocksCard({ turn, onSend, disabled }) {
  const [blocks, setBlocks] = useState(() => structuredClone(turn.blocks || []));
  const [bandLow, setBandLow] = useState(50);
  const [bandHigh, setBandHigh] = useState(500);

  function setBlock(i, patch) {
    setBlocks(prev => {
      const next = structuredClone(prev);
      next[i] = { ...next[i], ...patch };
      return next;
    });
  }

  function setSyn(i, syns) { setBlock(i, { free_text_synonyms: syns }); }

  function dropMesh(blockIdx, meshIdx) {
    setBlocks(prev => {
      const next = structuredClone(prev);
      next[blockIdx].mesh_terms.splice(meshIdx, 1);
      return next;
    });
  }

  function submit() {
    if (disabled) return;
    onSend(formatQueryConfirmation(blocks, [Number(bandLow) || 50, Number(bandHigh) || 500]));
  }

  return (
    <div className="card">
      <div className="card-header">
        <h3>Query Blocks</h3>
        <span className="card-tag query_blocks">query_blocks</span>
      </div>

      <div style={{ fontSize: 13, color: "#8b93a7", marginBottom: 14, lineHeight: 1.5 }}>
        Question: <em>{turn.research_question}</em>
      </div>

      {blocks.map((b, i) => (
        <div className="qb-block" key={i}>
          <div className="qb-block-header">
            <span className="qb-label-pill">{b.label}</span>
            <span className="qb-concept">{b.concept}</span>
          </div>
          {b.mesh_terms && b.mesh_terms.length > 0 && (
            <div className="qb-mesh-row">
              <span className="label">MeSH</span>
              {b.mesh_terms.map((m, j) => (
                <span key={j} className="qb-mesh-chip">
                  {m.descriptor}<span className="mid">UID {m.mesh_id}</span>
                  <button className="copy-btn" style={{ marginLeft: 6, padding: "0 6px" }} onClick={() => dropMesh(i, j)} disabled={disabled} title="Remove this MeSH term">×</button>
                </span>
              ))}
            </div>
          )}
          <div className="qb-syn-row">
            <span className="label">Free-text synonyms</span>
          </div>
          <ListField label="" values={b.free_text_synonyms || []} onChange={v => setSyn(i, v)} placeholder="e.g., omeprazole" />
          <div className="qb-composed">{b.composed}</div>
        </div>
      ))}

      {turn.notes && <div className="rationale">{turn.notes}</div>}

      <div className="target-band-row">
        <span>Target hit-count band:</span>
        <input type="number" min="1" value={bandLow} onChange={e => setBandLow(e.target.value)} disabled={disabled} />
        <span>–</span>
        <input type="number" min="1" value={bandHigh} onChange={e => setBandHigh(e.target.value)} disabled={disabled} />
        <span>PubMed hits</span>
      </div>

      <div className="card-actions">
        <button className="btn-primary" onClick={submit} disabled={disabled}>
          Confirm terms — compose &amp; test
        </button>
        <button className="btn-secondary" onClick={() => setBlocks(structuredClone(turn.blocks || []))} disabled={disabled}>
          Reset edits
        </button>
      </div>
    </div>
  );
}

/* ── Search-strategy: composed-query result + plans + refinements ─────── */

function CopyButton({ text, label = "Copy" }) {
  const [copied, setCopied] = useState(false);
  async function copy() {
    try {
      await navigator.clipboard.writeText(text);
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    } catch {}
  }
  return (
    <button className={`copy-btn ${copied ? "copied" : ""}`} onClick={copy}>
      {copied ? "Copied" : label}
    </button>
  );
}

function PlanCard({ plan }) {
  const hits = plan.executable
    ? <span className="plan-hits">{plan.estimated_hits != null ? plan.estimated_hits.toLocaleString() : "?"} hits</span>
    : <span className="plan-hits muted">not executed here — copy &amp; run manually</span>;
  return (
    <div className={`plan-card ${plan.executable ? "" : "unexec"}`}>
      <div className="plan-header">
        <div>
          <span className="plan-db">{plan.database.replace("_", " ")}</span>
          <span className="plan-dialect">{plan.syntax_dialect}</span>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          {hits}
          <CopyButton text={plan.composed_query} />
        </div>
      </div>
      <div className="plan-query">{plan.composed_query}</div>
      {plan.caveats && plan.caveats.length > 0 && (
        <div className="plan-caveats">
          {plan.caveats.map((c, i) => <div key={i}>⚠ {c}</div>)}
        </div>
      )}
      {plan.access_note && <div className="plan-access">{plan.access_note}</div>}
    </div>
  );
}

function StrategyResultCard({ turn, onSend, onHandoff, onWatch, disabled }) {
  const pubmedPlan = (turn.query_plans || []).find(p => p.database === "pubmed");
  const pubmedHits = pubmedPlan && pubmedPlan.estimated_hits != null ? pubmedPlan.estimated_hits : null;
  const band = turn.target_band || [50, 500];

  let bandText;
  if (turn.band_status === "in_band") {
    bandText = `${pubmedHits != null ? pubmedHits.toLocaleString() : "?"} PubMed hits — inside the ${band[0]}–${band[1]} target band.`;
  } else if (turn.band_status === "below") {
    bandText = `Only ${pubmedHits != null ? pubmedHits.toLocaleString() : "?"} PubMed hits — below the ${band[0]}–${band[1]} target band. Consider broadening.`;
  } else {
    bandText = `${pubmedHits != null ? pubmedHits.toLocaleString() : "?"} PubMed hits — above the ${band[0]}–${band[1]} target band. Consider narrowing.`;
  }

  return (
    <div className="card">
      <div className="card-header">
        <h3>Search Strategy {turn.is_final ? "(Final)" : "(Draft)"}</h3>
        <span className="card-tag strategy_result">strategy_result</span>
      </div>

      <div className={`sr-band ${turn.band_status}`}>
        <span className="sr-band-num">{pubmedHits != null ? pubmedHits.toLocaleString() : "?"}</span> &nbsp; {bandText}
      </div>

      {(turn.query_plans || []).map((p, i) => <PlanCard key={i} plan={p} />)}

      {!turn.is_final && turn.refinement_suggestions && turn.refinement_suggestions.length > 0 && (
        <>
          <div style={{ fontSize: 12, textTransform: "uppercase", letterSpacing: ".5px", color: "#5a6070", fontWeight: 600, marginTop: 16, marginBottom: 4 }}>
            Suggested next moves
          </div>
          <div className="refinements">
            {turn.refinement_suggestions.map((r, i) => (
              <button key={i} className="refine-btn" onClick={() => onSend(formatRefinementClick(r.continuation))} disabled={disabled}>
                <span className={`dir ${r.direction}`}>{r.direction}</span>
                {r.label}
                <span className="why">{r.rationale}</span>
              </button>
            ))}
          </div>
        </>
      )}

      {turn.sample_hits && turn.sample_hits.length > 0 && (
        <div className="sample-hits">
          <h4>Sample hits ({turn.sample_hits.length})</h4>
          {turn.sample_hits.map((s, i) => {
            const url = s.pmid ? `https://pubmed.ncbi.nlm.nih.gov/${s.pmid}/` : (s.doi ? `https://doi.org/${s.doi}` : null);
            return (
              <div key={i} className="sample-hit">
                <div className="title">{url ? <a href={url} target="_blank" rel="noopener">{s.title}</a> : s.title}</div>
                <div className="meta">
                  {s.pmid && <>PMID {s.pmid}</>}
                  {s.journal && <> · {s.journal}</>}
                  {s.year && <> · {s.year}</>}
                  {s.source && <> · {s.source}</>}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {!turn.is_final && (
        <div className="card-actions">
          <button className="btn-primary" onClick={() => onSend(formatFinalize())} disabled={disabled}>
            Finalize strategy
          </button>
        </div>
      )}

      {turn.is_final && pubmedPlan && (
        <div className="handoff-cta">
          <div className="text">
            Strategy locked. Hand off to a follow-up specialist or save it as a living-review watch.
          </div>
          <div className="handoff-row">
            <button className="btn-primary" onClick={() => onHandoff(pubmedPlan.composed_query)} disabled={disabled}>
              Run meta-analysis on these results
            </button>
            <button
              className="btn-secondary"
              onClick={() => onWatch && onWatch(pubmedPlan.composed_query, (turn.sample_hits || []).map(s => s.pmid).filter(Boolean))}
              disabled={disabled || !onWatch}
            >
              Watch this query
            </button>
          </div>
        </div>
      )}

      {turn.notes && !turn.is_final && <div className="rationale">{turn.notes}</div>}
    </div>
  );
}

/* ── sr_protocol: methods editor ──────────────────────────────────────── */

const REVIEW_TYPES = ["intervention", "diagnostic", "prognostic", "etiology", "prevalence"];
const ROB_TOOLS = ["RoB 2.0", "ROBINS-I", "Newcastle-Ottawa", "QUADAS-2", "ROBIS", "AMSTAR-2"];
const SYNTHESIS_METHODS = [
  { value: "random_effects_meta", label: "Random-effects meta-analysis" },
  { value: "fixed_effects_meta",  label: "Fixed-effects meta-analysis"  },
  { value: "narrative_only",      label: "Narrative synthesis only"     },
];
const EFFECT_MEASURES = ["OR", "RR", "MD", "SMD"];

function ProtocolMethodsCard({ turn, onSend, disabled }) {
  const [methods, setMethods] = useState(() => structuredClone(turn));

  const set = (k, v) => setMethods(m => ({ ...m, [k]: v }));
  const setPico = (k, v) => setMethods(m => ({ ...m, pico: { ...m.pico, [k]: v } }));
  const setEligibility = (k, v) => setMethods(m => ({ ...m, eligibility: { ...m.eligibility, [k]: v } }));
  const setRob = (k, v) => setMethods(m => ({ ...m, rob_tool: { ...m.rob_tool, [k]: v } }));
  const setSyn = (k, v) => setMethods(m => ({ ...m, synthesis_plan: { ...m.synthesis_plan, [k]: v } }));

  function setEffectFor(outcome, measure) {
    setMethods(m => ({ ...m, effect_measures_plan: { ...m.effect_measures_plan, [outcome]: measure } }));
  }

  function submit() {
    if (disabled) return;
    onSend(formatMethodsConfirmation(methods));
  }

  const outcomes = methods.pico && methods.pico.outcomes ? methods.pico.outcomes : [];

  return (
    <div className="card">
      <div className="card-header">
        <h3>Protocol Methods</h3>
        <span className="card-tag protocol_methods">protocol_methods</span>
      </div>

      <div className="pm-section">
        <h4>Title &amp; review type</h4>
        <Field label="Working title" value={methods.title || ""} onChange={v => set("title", v)} multiline full />
        <div className="pm-row" style={{ marginTop: 8 }}>
          <label style={{ fontSize: 11, color: "#5a6070", textTransform: "uppercase", fontWeight: 600 }}>Review type</label>
          <select className="pm-select" value={methods.review_type || "intervention"} onChange={e => set("review_type", e.target.value)} disabled={disabled}>
            {REVIEW_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
          </select>
        </div>
      </div>

      <div className="pm-section">
        <h4>PICO</h4>
        <div className="pico-grid">
          <Field label="Population" value={methods.pico.population} onChange={v => setPico("population", v)} multiline full />
          <Field label="Intervention" value={methods.pico.intervention} onChange={v => setPico("intervention", v)} multiline />
          <Field label="Comparison" value={methods.pico.comparison} onChange={v => setPico("comparison", v)} multiline />
          <ListField label="Outcomes" full values={methods.pico.outcomes || []} onChange={v => setPico("outcomes", v)} placeholder="e.g., Heart-failure hospitalization" />
        </div>
      </div>

      <div className="pm-section">
        <h4>Eligibility criteria</h4>
        <div className="pm-eligibility-grid">
          <ListField label="Inclusion" values={methods.eligibility.inclusion || []} onChange={v => setEligibility("inclusion", v)} placeholder="e.g., RCT design" />
          <ListField label="Exclusion" values={methods.eligibility.exclusion || []} onChange={v => setEligibility("exclusion", v)} placeholder="e.g., case reports" />
          <ListField label="Study designs" values={methods.eligibility.study_designs || []} onChange={v => setEligibility("study_designs", v)} placeholder="e.g., Randomized Controlled Trial" />
          <ListField label="Languages" values={methods.eligibility.language || []} onChange={v => setEligibility("language", v)} placeholder="e.g., English" />
          <Field label="Date range" value={methods.eligibility.date_range || ""} onChange={v => setEligibility("date_range", v)} placeholder="e.g., 2010–present" />
          <Field label="Age range" value={methods.eligibility.age_range || ""} onChange={v => setEligibility("age_range", v)} placeholder="e.g., ≥18 years" />
          <Field label="Setting" value={methods.eligibility.setting || ""} onChange={v => setEligibility("setting", v)} placeholder="e.g., outpatient" full />
        </div>
      </div>

      <div className="pm-section">
        <h4>Information sources</h4>
        <ListField label="" values={methods.information_sources || []} onChange={v => set("information_sources", v)} placeholder="e.g., CINAHL" />
      </div>

      <div className="pm-section">
        <h4>Risk-of-bias tool</h4>
        <div className="pm-row">
          <label style={{ fontSize: 11, color: "#5a6070", textTransform: "uppercase", fontWeight: 600 }}>Tool</label>
          <select className="pm-select" value={methods.rob_tool.tool} onChange={e => setRob("tool", e.target.value)} disabled={disabled}>
            {ROB_TOOLS.map(t => <option key={t} value={t}>{t}</option>)}
          </select>
        </div>
        <Field label="Rationale" value={methods.rob_tool.rationale || ""} onChange={v => setRob("rationale", v)} multiline full />
      </div>

      <div className="pm-section">
        <h4>Effect-measures plan</h4>
        {outcomes.length === 0 && <div style={{ fontSize: 12, color: "#8b93a7" }}>Add outcomes above to plan effect measures.</div>}
        {outcomes.map((o, i) => {
          const measure = (methods.effect_measures_plan && methods.effect_measures_plan[o]) || "RR";
          return (
            <div key={i} className="pm-em-row">
              <div className="pm-em-name">{o}</div>
              <select className="pm-select" value={measure} onChange={e => setEffectFor(o, e.target.value)} disabled={disabled}>
                {EFFECT_MEASURES.map(m => <option key={m} value={m}>{m}</option>)}
              </select>
            </div>
          );
        })}
      </div>

      <div className="pm-section">
        <h4>Synthesis plan</h4>
        <div className="pm-row">
          <label style={{ fontSize: 11, color: "#5a6070", textTransform: "uppercase", fontWeight: 600 }}>Primary method</label>
          <select className="pm-select" value={methods.synthesis_plan.primary_method} onChange={e => setSyn("primary_method", e.target.value)} disabled={disabled}>
            {SYNTHESIS_METHODS.map(m => <option key={m.value} value={m.value}>{m.label}</option>)}
          </select>
        </div>
        <div className="pm-eligibility-grid" style={{ marginTop: 8 }}>
          <ListField label="Heterogeneity assessment" values={methods.synthesis_plan.heterogeneity_assessment || []} onChange={v => setSyn("heterogeneity_assessment", v)} placeholder="e.g., I²" />
          <ListField label="Publication-bias methods" values={methods.synthesis_plan.publication_bias_methods || []} onChange={v => setSyn("publication_bias_methods", v)} placeholder="e.g., Funnel plot" />
          <ListField label="Planned subgroups" values={methods.synthesis_plan.planned_subgroups || []} onChange={v => setSyn("planned_subgroups", v)} placeholder="e.g., baseline severity" />
          <ListField label="Sensitivity analyses" values={methods.synthesis_plan.planned_sensitivity_analyses || []} onChange={v => setSyn("planned_sensitivity_analyses", v)} placeholder="e.g., exclude high-RoB studies" />
        </div>
      </div>

      <div className="pm-section">
        <div className="pm-checkbox-row">
          <input type="checkbox" checked={!!methods.use_grade} onChange={e => set("use_grade", e.target.checked)} disabled={disabled} />
          <span>Plan to use GRADE for certainty-of-evidence assessment</span>
        </div>
      </div>

      {methods.notes && <div className="rationale">{methods.notes}</div>}

      <div className="card-actions">
        <button className="btn-primary" onClick={submit} disabled={disabled}>
          Methods confirmed — draft full protocol
        </button>
        <button className="btn-secondary" onClick={() => setMethods(structuredClone(turn))} disabled={disabled}>
          Reset edits
        </button>
      </div>
    </div>
  );
}

/* ── Watch this query: modal ──────────────────────────────────────────── */

const SCHEDULE_PRESETS = [
  { id: "daily",   label: "Daily 09:00",        cron: "0 9 * * *" },
  { id: "weekly",  label: "Mondays 09:00",      cron: "0 9 * * 1" },
  { id: "monthly", label: "1st of month 09:00", cron: "0 9 1 * *" },
  { id: "demo",    label: "Every 2 minutes (demo)", cron: "*/2 * * * *" },
];

function WatchModal({ spec, onClose, onCreated }) {
  const [name, setName] = useState(spec.defaultName || "Untitled watch");
  const [presetId, setPresetId] = useState("weekly");
  const [customCron, setCustomCron] = useState("");
  const [threshold, setThreshold] = useState(0.6);
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState(null);

  const cronToUse = customCron.trim() || (SCHEDULE_PRESETS.find(p => p.id === presetId) || {}).cron || "0 9 * * 1";

  async function submit() {
    if (!name.trim()) { setError("Name is required."); return; }
    setSubmitting(true);
    setError(null);
    try {
      const body = {
        name: name.trim(),
        pico: spec.picoSeed,
        search_query: spec.pubmedQuery,
        sources: ["pubmed", "europepmc"],
        schedule_cron: cronToUse,
        triage_threshold: Number(threshold),
        baseline_pmids: spec.sampleHitPmids || [],
      };
      const res = await fetch("/api/watches", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error(extractErrorMessage(await res.text()));
      onCreated();
    } catch (e) {
      setError(e.message || String(e));
    } finally {
      setSubmitting(false);
    }
  }

  return (
    <div className="modal-backdrop" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal">
        <h3>Watch this query</h3>
        <p className="lead">
          The scheduler will re-run this PubMed query at the chosen frequency, triage any new hits against the
          PICO snapshot, and notify you when a new paper exceeds the materiality threshold. The current
          sample-hit PMIDs ({(spec.sampleHitPmids || []).length}) become the baseline so the first scheduled run
          only surfaces genuinely new evidence.
        </p>

        <div className="modal-section">
          <label>Watch name</label>
          <input type="text" value={name} onChange={e => setName(e.target.value)} disabled={submitting} />
        </div>

        <div className="modal-section">
          <label>Schedule</label>
          <div className="schedule-presets">
            {SCHEDULE_PRESETS.map(p => (
              <button
                key={p.id}
                className={`preset-chip ${presetId === p.id && !customCron ? "selected" : ""}`}
                onClick={() => { setPresetId(p.id); setCustomCron(""); }}
                disabled={submitting}
              >
                {p.label}
              </button>
            ))}
          </div>
          <label style={{ marginTop: 8 }}>Or custom cron (5 fields: minute hour day month dow)</label>
          <input
            type="text"
            placeholder={(SCHEDULE_PRESETS.find(p => p.id === presetId) || {}).cron || ""}
            value={customCron}
            onChange={e => setCustomCron(e.target.value)}
            disabled={submitting}
            style={{ fontFamily: "Consolas, Monaco, monospace" }}
          />
          <div style={{ fontSize: 11, color: "#5a6070", marginTop: 4 }}>
            Will fire on: <code style={{ color: "#b3cfee" }}>{cronToUse}</code>
          </div>
        </div>

        <div className="modal-section">
          <label>Materiality threshold (0 = notify on any new paper, 1 = only landmark)</label>
          <div className="threshold-row">
            <input
              type="range" min="0" max="1" step="0.05"
              value={threshold} onChange={e => setThreshold(e.target.value)} disabled={submitting}
            />
            <span className="threshold-val">{Number(threshold).toFixed(2)}</span>
          </div>
        </div>

        {error && <div style={{ color: "#d97a7a", fontSize: 12, marginTop: 8 }}>⚠ {error}</div>}

        <div className="modal-actions">
          <button className="btn-secondary" onClick={onClose} disabled={submitting}>Cancel</button>
          <button className="btn-primary" onClick={submit} disabled={submitting}>
            {submitting ? "Creating…" : "Create watch"}
          </button>
        </div>
      </div>
    </div>
  );
}

function RobAssessmentsCard({ turn, onSend, disabled }) {
  const [assessments, setAssessments] = useState(() => structuredClone(turn.assessments || []));
  const [expandedRows, setExpandedRows] = useState(() => new Set());

  function rowKey(si, di) { return `${si}-${di}`; }
  function toggleExpand(si, di) {
    setExpandedRows(prev => {
      const next = new Set(prev);
      const k = rowKey(si, di);
      if (next.has(k)) next.delete(k); else next.add(k);
      return next;
    });
  }

  function setDomainField(si, di, patch) {
    setAssessments(prev => {
      const next = structuredClone(prev);
      next[si].domains[di] = { ...next[si].domains[di], ...patch };
      // Recompute overall judgment per RoB 2.0 / generic worst-domain rule.
      const judgments = next[si].domains.map(d => d.judgment);
      let overall = "low";
      if (judgments.includes("high")) overall = "high";
      else if (judgments.includes("some_concerns")) overall = "some_concerns";
      else if (judgments.includes("no_information")) overall = "some_concerns";
      next[si].overall_judgment = overall;
      return next;
    });
  }

  function setOverall(si, judgment) {
    setAssessments(prev => {
      const next = structuredClone(prev);
      next[si].overall_judgment = judgment;
      return next;
    });
  }

  function submit() {
    if (disabled) return;
    onSend(formatRobConfirmation(turn.tool, assessments));
  }

  return (
    <div className="card">
      <div className="card-header">
        <h3>Risk of Bias — Assessments</h3>
        <span className="card-tag rob_assessments">rob_assessments</span>
      </div>

      <div className="rob-tool-row">
        <span style={{ fontSize: 11, textTransform: "uppercase", color: "#5a6070", fontWeight: 600, letterSpacing: ".5px" }}>Tool</span>
        <span className="rob-tool-pill">{turn.tool}</span>
        <span style={{ fontSize: 12, color: "#8b93a7" }}>· {assessments.length} studies</span>
      </div>

      {turn.summary && <div className="rob-summary-box">{turn.summary}</div>}

      {assessments.map((s, si) => (
        <div className="rob-study" key={s.pmid || si}>
          <div className="rob-study-head">
            <div>
              <div className="rob-study-title">{s.title}</div>
              <div className="rob-study-meta">
                {s.pmid && (
                  <a href={`https://pubmed.ncbi.nlm.nih.gov/${s.pmid}/`} target="_blank" rel="noopener">
                    PMID {s.pmid}
                  </a>
                )}
                <span>·</span>
                <span>{s.study_design}</span>
              </div>
            </div>
            <div className="rob-overall-row">
              <span className="lbl">Overall</span>
              <select
                className={`judgment-select ${s.overall_judgment}`}
                value={s.overall_judgment}
                onChange={e => setOverall(si, e.target.value)}
                disabled={disabled}
              >
                {ROB_JUDGMENTS.map(j => <option key={j.id} value={j.id}>{j.label}</option>)}
              </select>
            </div>
          </div>

          {s.domains.map((d, di) => {
            const k = rowKey(si, di);
            const expanded = expandedRows.has(k);
            return (
              <div className="rob-domain-row" key={di}>
                <div className="rob-domain-name">{d.domain}</div>
                <select
                  className={`judgment-select ${d.judgment}`}
                  value={d.judgment}
                  onChange={e => setDomainField(si, di, { judgment: e.target.value })}
                  disabled={disabled}
                >
                  {ROB_JUDGMENTS.map(j => <option key={j.id} value={j.id}>{j.label}</option>)}
                </select>
                <button className="rob-domain-toggle" onClick={() => toggleExpand(si, di)}>
                  {expanded ? "Hide justification" : "Show justification"}
                </button>
                {expanded && (
                  <>
                    <div className="rob-domain-justify">
                      <textarea
                        value={d.justification}
                        onChange={e => setDomainField(si, di, { justification: e.target.value })}
                        disabled={disabled}
                      />
                    </div>
                    {d.quote && (
                      <div className="rob-domain-quote">"{d.quote}"</div>
                    )}
                  </>
                )}
                {!expanded && (
                  <div className="rob-domain-justify" style={{ color: "#5a6070", fontSize: 11 }}>
                    {(d.justification || "").slice(0, 120)}{(d.justification || "").length > 120 ? "…" : ""}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      ))}

      <div className="card-actions">
        <button className="btn-primary" onClick={submit} disabled={disabled}>
          RoB confirmed — generate summary
        </button>
        <button className="btn-secondary" onClick={() => setAssessments(structuredClone(turn.assessments || []))} disabled={disabled}>
          Reset edits
        </button>
      </div>
    </div>
  );
}

/* ── risk_of_bias: summary card + meta-analysis sensitivity handoff ───── */

function RobSummaryCard({ turn, onSend, onHandoffRobToMeta, disabled }) {
  const distribution = turn.domain_distribution || [];
  const highPmids = turn.high_rob_pmids || [];
  const recs = turn.sensitivity_recommendations || [];

  return (
    <div className="card">
      <div className="card-header">
        <h3>Risk of Bias — Summary {turn.is_final ? "(Final)" : "(Draft)"}</h3>
        <span className="card-tag rob_summary">rob_summary</span>
      </div>

      <div className="rob-tool-row">
        <span style={{ fontSize: 11, textTransform: "uppercase", color: "#5a6070", fontWeight: 600, letterSpacing: ".5px" }}>Tool</span>
        <span className="rob-tool-pill">{turn.tool}</span>
      </div>

      {turn.summary_plot_image
        ? <div className="rob-plot"><img src={turn.summary_plot_image} alt="RoB summary plot" /></div>
        : <div className="rob-plot missing">Summary plot was not produced — check the assessments turn or try again.</div>}

      {distribution.length > 0 && (
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12, marginBottom: 14 }}>
          <thead>
            <tr style={{ color: "#5a6070", textTransform: "uppercase", fontSize: 10, letterSpacing: ".4px" }}>
              <th style={{ textAlign: "left", padding: "6px 8px", borderBottom: "1px solid #2a2f3a" }}>Domain</th>
              <th style={{ textAlign: "right", padding: "6px 8px", borderBottom: "1px solid #2a2f3a", color: "#6bcf7f" }}>Low</th>
              <th style={{ textAlign: "right", padding: "6px 8px", borderBottom: "1px solid #2a2f3a", color: "#d9a84a" }}>Some</th>
              <th style={{ textAlign: "right", padding: "6px 8px", borderBottom: "1px solid #2a2f3a", color: "#d97a7a" }}>High</th>
              <th style={{ textAlign: "right", padding: "6px 8px", borderBottom: "1px solid #2a2f3a", color: "#8b93a7" }}>No info</th>
            </tr>
          </thead>
          <tbody>
            {distribution.map((d, i) => (
              <tr key={i} style={{ borderBottom: "1px solid #1f232c" }}>
                <td style={{ padding: "6px 8px", color: "#b3b9c8" }}>{d.domain}</td>
                <td style={{ padding: "6px 8px", textAlign: "right", color: "#6bcf7f" }}>{d.low}</td>
                <td style={{ padding: "6px 8px", textAlign: "right", color: "#d9a84a" }}>{d.some_concerns}</td>
                <td style={{ padding: "6px 8px", textAlign: "right", color: "#d97a7a" }}>{d.high}</td>
                <td style={{ padding: "6px 8px", textAlign: "right", color: "#8b93a7" }}>{d.no_information}</td>
              </tr>
            ))}
          </tbody>
        </table>
      )}

      {turn.narrative && <div className="rob-narrative">{turn.narrative}</div>}

      {(recs.length > 0 || highPmids.length > 0) && (
        <div className="rob-sensitivity">
          <h4>Sensitivity recommendations</h4>
          {recs.length > 0 && (
            <ul>{recs.map((r, i) => <li key={i}>{r}</li>)}</ul>
          )}
          {highPmids.length > 0 && (
            <>
              <div style={{ fontSize: 10, textTransform: "uppercase", color: "#d9a84a", letterSpacing: ".5px", marginTop: 8, fontWeight: 600 }}>
                High-RoB PMIDs
              </div>
              <div className="rob-high-pmids">
                {highPmids.map(p => (
                  <span key={p} className="chip">
                    <a href={`https://pubmed.ncbi.nlm.nih.gov/${p}/`} target="_blank" rel="noopener">PMID {p}</a>
                  </span>
                ))}
              </div>
            </>
          )}
        </div>
      )}

      {!turn.is_final && (
        <div className="card-actions">
          <button className="btn-primary" onClick={() => onSend(formatRobFinalize())} disabled={disabled}>
            Finalize RoB
          </button>
        </div>
      )}

      {turn.is_final && (
        <div className="handoff-cta">
          <div className="text">
            RoB locked. {highPmids.length > 0
              ? `Spawn a sensitivity meta-analysis excluding the ${highPmids.length} high-RoB study${highPmids.length === 1 ? "" : "ies"}?`
              : "No high-RoB studies to exclude — the original meta-analysis stands."}
          </div>
          <button
            className="btn-primary"
            onClick={() => onHandoffRobToMeta && onHandoffRobToMeta(highPmids)}
            disabled={disabled || !onHandoffRobToMeta || highPmids.length === 0}
          >
            Re-run meta-analysis excluding high-RoB studies
          </button>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
