[project]
name = "research-assistant"
version = "0.1.0"
description = "Clinical research assistant — Pydantic AI agent with AWS Bedrock + FastAPI + React CDN frontend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic-ai>=0.0.54",
    "boto3>=1.34",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "tavily-python>=0.5",
    "wikipedia-api>=0.7.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",       # kept for test fixtures (in-memory SQLite)
    "asyncpg>=0.30",         # PostgreSQL async driver (compose / prod)
    "python-jose[cryptography]>=3.3",  # JWT validation for Cognito ID tokens
    "itsdangerous>=2.2",     # signed session-cookie serializer
    "pymupdf>=1.28.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "reportlab>=5.0.0",        # PDF generation for downloadable meta-analysis reports
    "docker>=7.0",
    "apscheduler>=3.11",
    "pgvector>=0.3",         # pgvector SQLAlchemy type + asyncpg codec (RAG embeddings)
    "scipy>=1.18.0",           # sample_size tool needs scipy.stats.norm/t inverse CDFs
    "defusedxml>=0.7",       # hardened XML parsing for external API responses (PubMed)
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

[project.scripts]
research-assistant = "research_assistant.__main__:main"
cra = "research_assistant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_assistant"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "S",   # bandit security checks
    "RUF", # ruff-native rules
    "PT",  # pytest style
]
ignore = [
    # Type-narrowing asserts are the mypy-strict idiom throughout src/ and
    # the app never runs under `python -O`; pytest asserts dominate tests/.
    "S101",
    # Clinical text legitimately uses en/em dashes, ×, µ, Greek letters.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.flake8-bugbear]
# RBAC-2 dependency factories return `Depends(...)` and are the standard
# FastAPI idiom for parameter-level auth. Treat them as immutable like
# fastapi.Depends so B008 doesn't fire on every gated route.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Form",
    "fastapi.File",
    "research_assistant.web.authz.require_permission_scoped",
]

[tool.ruff.lint.per-file-ignores]
# S105/S106: hardcoded test credentials are fixtures, not secrets.
# S108: sandbox tests reference fixed in-container /tmp paths by design.
"tests/**/*.py" = ["E501", "S105", "S106", "S108"]
# Long prompt strings and sample-question text are intentionally verbose.
"src/research_assistant/agent/prompts.py" = ["E501"]
"src/research_assistant/data/sample_questions.py" = ["E501"]
# Feature-PDF generator: long reportlab string literals the formatter won't split.
"scripts/generate_feature_pdf.py" = ["E501"]
# PRISMA 2020 item text is the canonical wording from Page et al. (BMJ 2021).
"src/research_assistant/domain/grade.py" = ["E501"]
# FastAPI relies on call-in-default for Form/File dependency injection.
"src/research_assistant/web/app.py" = ["B008"]

[tool.mypy]
strict = true
python_version = "3.13"
# Sandbox scripts are bundled package data — they execute inside the
# Docker sandbox where pandas/numpy/statsmodels live; the host venv
# may not have stubs for those. Treat them as opaque text from the
# host's perspective and skip strict checking.
exclude = [
    "tests/",
    "src/research_assistant/cdisc/sandbox_scripts/",
    "src/research_assistant/trial_stats/sandbox_scripts/",
    "src/research_assistant/visualizations/sandbox_scripts/",
    "src/research_assistant/nma/sandbox_scripts/",
    "src/research_assistant/ipd/sandbox_scripts/",
]

[[tool.mypy.overrides]]
module = ["wikipediaapi", "tavily", "fitz", "docx", "docx.*", "pptx", "docker", "docker.*", "jose", "jose.*", "itsdangerous", "boto3", "botocore", "botocore.*", "pgvector", "pgvector.*", "apscheduler", "apscheduler.*", "reportlab", "reportlab.*", "defusedxml", "defusedxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# aiosqlite runs each connection on a background worker thread. On Windows +
# Python 3.13, when the per-test event loop tears down, an in-flight worker
# op can land on the already-closed loop and surface as a benign
# PytestUnhandledThreadExceptionWarning ("Event loop is closed"). It is
# non-deterministic (count swings run-to-run), never fails a test, and comes
# from the driver's teardown — not app code. Disposing engines in-test
# doesn't reliably clear it, so we suppress this one thread-exception class
# to keep the signal readable. Scoped to the exact category; real assertion
# failures are unaffected.
filterwarnings = [
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.coverage.run]
source = ["research_assistant"]
# Sandbox scripts execute inside the Docker sandbox, never on the host —
# host-side coverage would report a misleading 0% for them.
omit = ["*/sandbox_scripts/*"]

[tool.coverage.report]
skip_empty = true
# Ratchet: set just below measured coverage (71% on 2026-08-03) so it can
# only go up. Raise deliberately; never lower without discussion.
fail_under = 70
